<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>JKB-DUMP :: 驾考宝典数据浏览器</title>
<style>
/* ========== 极简灰阶主题 ==========
   无圆角 无阴影 无渐变 无动画 纯原生
   灰阶层级 + 单一低饱和暖金强调
   性能优先: 只画必需的像素 */
:root{
  --bg:#111111;
  --bg2:#161616;
  --bg3:#1e1e1e;
  --fg:#e8e8e8;
  --fg-dim:#9a9a9a;
  --fg-mut:#5a5a5a;
  --amber:#d3b25e;      /* 唯一强调色: 链接/标题/重要数字 */
  --red:#c05757;        /* 仅错误态 */
  --cyan:#9a9a9a;       /* 信息字段 = 次级灰 */
  --border:#2b2b2b;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.55;
  text-rendering:optimizeSpeed;
  -webkit-font-smoothing:none;
}
/* 顶栏 */
#topbar{
  background:var(--bg2);
  border-bottom:2px solid var(--fg-dim);
  padding:6px 12px;
  display:flex;align-items:center;gap:14px;
  font-size:12px;
  position:sticky;top:0;z-index:10;
  white-space:nowrap;overflow:hidden;
}
#topbar .title{font-weight:bold;color:var(--amber);letter-spacing:1px}
#topbar .sep{color:var(--fg-mut)}
#topbar .stat{color:var(--fg-dim)}
#topbar .stat b{color:var(--fg)}
#topbar .right{margin-left:auto;color:var(--fg-mut);font-size:11px}
/* 布局 */
#layout{display:flex;height:calc(100vh - 36px)}
/* 侧栏 */
#sidebar{
  width:190px;min-width:190px;
  background:var(--bg2);
  border-right:2px solid var(--border);
  overflow-y:auto;
  padding:8px 0;
  flex-shrink:0;
}
#sidebar .nav-head{font-size:10px;color:var(--fg-mut);padding:6px 12px 2px;letter-spacing:2px}
#sidebar a.nav{
  display:block;padding:4px 12px;color:var(--fg-dim);
  text-decoration:none;font-size:12px;border-left:3px solid transparent;cursor:pointer;
}
#sidebar a.nav:hover{background:var(--bg3);color:var(--fg)}
#sidebar a.nav.active{background:var(--bg3);color:var(--amber);border-left-color:var(--amber)}
/* 主区 */
#main{flex:1;overflow-y:auto;padding:14px 18px;min-width:0}
h1{font-size:17px;color:var(--fg);margin-bottom:4px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 .hash{color:var(--fg-mut);font-weight:normal}
h2{font-size:13px;color:var(--fg);margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:3px}
h3{font-size:12px;color:var(--fg-dim);margin:10px 0 4px}
.sub{color:var(--fg-dim);font-size:11px;margin-bottom:12px;line-height:1.6}
.badge{display:inline-block;font-size:10px;padding:0 5px;border:1px solid var(--fg-dim);color:var(--fg-dim);margin-left:5px;white-space:nowrap}
.badge.ok{border-color:var(--fg);color:var(--fg)}
.badge.new{border-color:var(--border);color:var(--fg-dim)}
.badge.vip{border-color:var(--amber);color:var(--amber)}
.badge.v500{border-color:var(--border);color:var(--fg-dim)}
/* 统计格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;margin:8px 0}
.tile{background:var(--bg2);border:1px solid var(--border);padding:7px 9px}
.tile .n{font-size:19px;font-weight:bold;color:var(--fg);font-variant-numeric:tabular-nums}
.tile .n small{font-size:11px;color:var(--fg-dim);font-weight:normal}
.tile .l{font-size:9px;color:var(--fg-mut);margin-top:2px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hv-tile{cursor:pointer;transition:border-color .12s}
.hv-tile:hover{border-color:var(--amber)}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
th{text-align:left;font-size:9px;color:var(--fg-mut);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--fg-dim);padding:3px 7px;white-space:nowrap}
td{border-bottom:1px solid var(--border);padding:3px 7px;vertical-align:top;word-break:break-word}
tr:hover td{background:var(--bg3)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .dim{color:var(--fg-mut);font-size:10px}
a{color:var(--amber);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
/* 车型卡 */
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin:8px 0}
.car{background:var(--bg2);border:1px solid var(--border);padding:7px 9px;cursor:pointer}
.car:hover{border-color:var(--amber)}
.car .name{font-size:12px;color:var(--fg);font-weight:bold}
.car .meta{font-size:9px;color:var(--fg-mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car .qs{font-size:10px;color:var(--fg-dim);margin-top:3px}
/* 题目列表 */
.qlist{list-style:none}
.qlist li{padding:5px 9px;border-bottom:1px solid var(--border);cursor:pointer}
.qlist li:hover{background:var(--bg3)}
.qlist .qid{color:var(--fg-dim);font-size:10px;margin-right:7px;font-variant-numeric:tabular-nums}
.qlist .qtext{color:var(--fg);font-size:12px}
/* 详情 */
.detail{background:var(--bg2);border:1px solid var(--border);padding:10px 12px;margin:8px 0}
.detail .field{margin:5px 0}
.detail .flabel{font-size:9px;color:var(--fg-mut);text-transform:uppercase;letter-spacing:1px;margin-right:8px;display:inline-block;min-width:72px;vertical-align:top;padding-top:1px}
.detail .fval{color:var(--fg);font-size:12px}
.detail .fval.dim{color:var(--fg-dim)}
.opt{display:block;margin:1px 0;padding:1px 5px;font-size:12px}
.opt.correct{background:var(--bg3);color:var(--amber)}
.opt.correct::before{content:"[X] ";color:var(--amber)}
/* 面包屑 */
.crumb{font-size:11px;color:var(--fg-mut);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:var(--fg)}
.crumb .sep{color:var(--fg-mut);margin:0 3px}
/* 输入 */
#search-box{background:var(--bg2);border:1px solid var(--fg-dim);color:var(--fg);font-family:var(--mono);font-size:12px;padding:4px 9px;width:100%;max-width:440px;outline:none;margin-bottom:10px}
#search-box:focus{border-color:var(--fg-dim)}
/* 按钮 */
button{background:var(--bg2);border:1px solid var(--fg-dim);color:var(--fg);font-family:var(--mono);font-size:10px;padding:2px 9px;cursor:pointer;margin-right:4px}
button:hover{border-color:var(--fg);color:var(--fg)}
/* 状态 */
.loading{color:var(--fg-dim);font-size:11px;padding:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.loading::before{content:"";width:10px;height:10px;border:1px solid var(--fg-mut);border-top-color:var(--amber);animation:spin .9s linear infinite;flex-shrink:0}
.empty{color:var(--fg-mut);font-size:11px;padding:16px;text-align:center}
.empty::before{content:"[EMPTY] "}
.err{color:var(--red);font-size:11px;padding:16px;text-align:center;white-space:pre-wrap}
.err::before{content:"[ERROR] "}
@keyframes spin{to{transform:rotate(360deg)}}
/* 顶部加载进度条: 细条 + 右侧活动提示, 固定于视口顶端, 不挡操作 */
#prog{position:fixed;top:0;left:0;right:0;z-index:100;display:none;pointer-events:none}
#prog.on{display:block}
#prog-bar{height:3px;background:var(--bg3);overflow:hidden}
#prog-fill{height:100%;width:20%;background:var(--amber);transition:width .18s ease}
#prog-fill.indet{animation:progflow 1.15s ease-in-out infinite}
@keyframes progflow{0%{margin-left:-20%}100%{margin-left:100%}}
#prog-label{position:absolute;top:5px;right:10px;font-size:10px;color:var(--fg-dim);background:rgba(17,17,17,.9);border:1px solid var(--border);padding:1px 7px;white-space:nowrap}
/* 分页 */
.pager{margin:8px 0;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pager .info{color:var(--fg-dim);font-size:10px}
/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fg-dim)}
/* 折叠 */
details{margin:5px 0}
details summary{cursor:pointer;color:var(--fg-dim);font-size:11px}
details[open] summary{color:var(--fg)}
/* 视频/图片 */
img.media{max-width:100%;max-height:180px;border:1px solid var(--border);margin:4px 0;display:block}
video.media{max-width:100%;max-height:180px;border:1px solid var(--border);margin:4px 0;display:block}
pre.dump{color:var(--fg-dim);font-size:10px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto}
/* ============ 移动端适配 ============ */
/* 表格横向滚动: 桌面 table 正常显示, 窄屏自身滚动不撑爆 body */
table{display:block;overflow-x:auto}
th,td{min-width:52px}
@media (min-width:769px){
  table{display:table}
  th,td{min-width:0}
}
/* 抽屉/汉堡 只在小屏显示 */
#menu-btn{display:none;background:none;border:1px solid var(--fg-dim);color:var(--fg);font-size:15px;line-height:1;padding:2px 8px;cursor:pointer;flex-shrink:0}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
body.menu-open #scrim{display:block;opacity:1;pointer-events:auto}
/* 小于等于 768: 侧栏收成抽屉 */
@media (max-width:768px){
  #topbar{height:36px;box-sizing:border-box}
  #menu-btn{display:inline-block}
  .tb-title{display:none}
  #layout{display:block;height:auto}
  #sidebar{
    position:fixed;inset:0 auto 0 0;z-index:50;
    width:min(78vw,240px);min-width:0;
    transform:translateX(-105%);transition:transform .18s;
    box-shadow:0 0 24px rgba(0,0,0,.5);
    padding-top:8px;
  }
  body.menu-open #sidebar{transform:translateX(0)}
  #main{padding:10px 12px}
  #topbar{gap:8px;padding:6px 8px}
  #topbar .right{font-size:9px}
  h1{white-space:normal;word-break:break-word;font-size:16px}
  .crumb{white-space:normal;overflow:visible;word-break:break-word}
  .grid{grid-template-columns:1fr}
  .car-grid{grid-template-columns:1fr 1fr}
  video.media{max-height:none;width:100%}
  img.media{max-height:220px;width:auto;margin:4px auto}
}
</style>
</head>
<body>

<div id="topbar">
  <button id="menu-btn" aria-label="菜单">☰</button>
  <span class="title">JKB-DUMP</span><span class="sep">|</span>
  <span class="tb-title">驾考宝典数据浏览器</span><span class="sep">|</span>
  <span class="stat" id="tb-version">version --</span><span class="sep">|</span>
  <span class="stat" id="tb-dbs">dbs --</span><span class="sep">|</span>
  <span class="stat" id="tb-qs">questions --</span>
  <span class="right" id="tb-load">IDLE</span>
</div>

<div id="layout">
  <div id="sidebar"></div>
  <div id="main"></div>
</div>
<div id="scrim" onclick="closeMenu()"></div>

<!-- 顶部加载进度条 (JS 在 #topbar 后注入) -->
<div id="prog"><div id="prog-bar"><div id="prog-fill"></div></div></div>

<script>
/* ============ 路径 ============ */
/* 根路径自动检测: 支持部署在子路径(如 nginx /jkbd/frontend/)或根路径(/frontend/).
   页面路径含 frontend/ 目录, 它前面的部分即根路径前缀. */
const _parts=location.pathname.split('/').filter(Boolean);
const _fi=_parts.lastIndexOf('frontend');          // frontend 目录所在层级
const ROOT=_fi<=0?'':'/'+_parts.slice(0,_fi).join('/');
const DATA=ROOT+'/data'; const HV=ROOT+'/harvested';
const FW=ROOT+'/frontend';               // by_qid, rank_index, dp_count 在 frontend/

/* ============ 车型名 ============ */
const CAR_NAMES={
 car:'小型汽车',bus:'大型客车',truck:'货车',moto:'摩托车',chuzu:'出租车',wangyue:'网约车',
 jiaolian:'教练车',keyun:'客运',huoyun:'货运',weixian:'危险品',baozha:'爆炸品',judu:'剧毒品',
 baozha_yayun:'爆炸品押运',baozha_zhuangxie:'爆炸品装卸',weixian_yayun:'危险品押运',
 weixian_zhuangxie:'危险品装卸',judu_yayun:'剧毒品押运',judu_zhuangxie:'剧毒品装卸',
 chache:'叉车',jiaolian_zaijiaoyu:'教练再教育',fixed_bvr:'固定翼BVR',fixed_wvr:'固定翼WVR',
 fixed_coach:'固定翼教员',helicopter_bvr:'直升机BVR',helicopter_wvr:'直升机WVR',
 helicopter_coach:'直升机教员',multi_bvr:'多旋翼BVR',multi_wvr:'多旋翼WVR',
 multi_coach:'多旋翼教员',vtol_bvr:'垂直起降BVR',vtol_wvr:'垂直起降WVR',
 vtol_coach:'垂直起降教员',light_trailer:'轻型挂车'
};

/* ============ 全局状态 ============ */
let INDEX=null, totalQuestions=0;
const qCache={};          // carType -> questions[] 全量缓存
let currentView='overview', crumb=[];
let rankIndex=null;       // rank_index.json 缓存
let vidMap=null;          // questionId -> [{shortVideoId, videoUrl}] 讲解视频映射
let vidUrlMap=null;       // shortVideoId -> videoUrl
async function loadVids(){
  if(vidMap)return vidMap;
  try{
    const [v,vu]=await Promise.all([
      loadJSON(HV+'/video-explain/video-list-all.json',{ttl:PAGE_CACHE_TTL}),
      loadJSON(HV+'/video-explain/video-urls.json',{ttl:PAGE_CACHE_TTL})
    ]);
    vidUrlMap=vu||{};
    vidMap={};
    for(const it of (v.itemList||[])){
      const qid=String(it.questionId);
      vidMap[qid]=vidMap[qid]||[];
      for(const dl of (it.dataList||[])){
        vidMap[qid].push({shortVideoId:dl.shortVideoId,
          videoUrl:vidUrlMap[dl.shortVideoId]?.videoUrl||null});
      }
    }
    return vidMap;
  }catch(e){vidMap={};return vidMap;}
}
function vidBadge(qid){
  const vids=vidMap&&vidMap[String(qid)];
  if(!vids||!vids.length)return '';
  return ' <span class="badge ok">▶讲解</span>';
}
function renderQuestionVideo(qid){
  const vids=vidMap&&vidMap[qid];
  if(!vids||!vids.length)return '';
  let h=`<h2>讲解视频 <span class="badge ok">${fmt(vids.length)}</span></h2>`;
  for(const v of vids){
    if(v.videoUrl){
      h+=`<video class="media" src="${esc(v.videoUrl)}" controls preload="metadata"></video>`;
    }else{
      h+=`<div class="dim">shortVideoId ${v.shortVideoId} (无直链)</div>`;
    }
  }
  return h;
}

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'--':Number(n).toLocaleString();
function setLoad(t){const e=$('#tb-load');if(e)e.textContent=t;}
/* 移动端抽屉菜单 */
function openMenu(){document.body.classList.add('menu-open');}
function closeMenu(){document.body.classList.remove('menu-open');}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.addEventListener('DOMContentLoaded',()=>{
  const mb=document.getElementById('menu-btn');
  if(mb)mb.addEventListener('click',e=>{e.stopPropagation();openMenu();});
});
/* ---- 顶部进度条: 顶部细条(字节进度/不确定动画) + 右上活动数 + 中央loading的spinner ---- */
const pg={n:0,lastShown:0,sumBytes:0,sumTotal:0,total:0,done:0,label:''};
const pFmt=n=>n==null?'--':Number(n).toLocaleString();
const pBar=()=>$('#prog-fill'), pWrp=()=>$('#prog');
function pgRefresh(){
  const el=pWrp(); if(!el)return;
  if(pg.n>0){
    el.classList.add('on');
    const t=Date.now()-pg.lastShown;
    let label=pg.label;
    if(pg.total>1&&pg.done>0){label+=` ${pg.done}/${pg.total}`;}
    if(pg.sumTotal>0){
      const pct=Math.min(99,Math.round(pg.sumBytes/pg.sumTotal*100));
      label+=` ${pct}% (${pFmt(pg.sumBytes)}/${pFmt(pg.sumTotal)})`;
    }else if(t>300){label+=' …';}
    const lbl=$('#prog-label');
    if(lbl)lbl.textContent=label;
    const fb=pBar();
    if(pg.sumTotal>0){
      fb.classList.remove('indet');
      fb.style.width=Math.min(100,Math.round(pg.sumBytes/pg.sumTotal*100))+'%';
      fb.style.marginLeft='0';
    }else{
      fb.classList.add('indet');fb.style.width='20%';fb.style.marginLeft='0';
    }
  }else{
    el.classList.remove('on');
    const fb=pBar();fb.classList.remove('indet');fb.style.width='0';
  }
}
function pgBegin(label,total){pg.n++;pg.lastShown=Date.now();pg.label=label;pg.total=total;pg.done=0;pg.sumBytes=0;pg.sumTotal=0;pgRefresh();}
function pgEnd(){pg.done++;pg.n=Math.max(0,pg.n-1);pgRefresh();}
function pgBytes(b,t){pg.sumBytes+=b;pg.sumTotal+=t;pgRefresh();}
async function getJSON(url,opt){
  const o=opt||{};
  const label=o.label||'GET '+url.split('/').slice(-2).join('/');
  const signal=o.timeout!=null?AbortSignal.timeout(o.timeout):null;
  pgBegin(label,o.total||0);
  setLoad(label);
  try{
    const r=await fetch(url,{cache:'no-store',signal});
    if(!r.ok)throw new Error('HTTP '+r.status+' '+url);
    if(o.total){
      const ct=Number(r.headers.get('Content-Length'))||0;
      const rd=r.body&&ct?r.body.getReader():null;
      if(rd){
        const chunks=[],tk=ct>0?ct:1;
        while(true){
          const{done,value}=await rd.read();
          if(done)break;
          chunks.push(value);pgBytes(value.length,tk);
        }
        const buf=new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));
        let off=0;for(const c of chunks){buf.set(c,off);off+=c.length;}
        return JSON.parse(new TextDecoder().decode(buf));
      }
    }
    return await r.json();
  }catch(e){if(e.name==='AbortError')throw new Error('超时: '+label);throw e;}
  finally{pgEnd();setLoad('IDLE');}
}
/* ---- HTTP 缓存层: 结果存 localStorage, TTL 到期才重拉.
   只缓存小文件(索引/计数/集合/榜单汇总), 大文件(排行榜166MB/题库)走内存缓存+字节进度. ---- */
const CACHE_PREFIX='jkbdv4:';
const PAGE_CACHE_TTL=10*60*1000;   // 小文件缓存 10 分钟
function cacheGet(url){
  try{
    const raw=localStorage.getItem(CACHE_PREFIX+url);
    if(!raw)return null;
    const o=JSON.parse(raw);
    if(!o.expires||Date.now()>o.expires)return null;
    return o.v;
  }catch(e){return null;}
}
function cacheSet(url,v,ttlMs){
  try{localStorage.setItem(CACHE_PREFIX+url,JSON.stringify({expires:Date.now()+ttlMs,v}));}catch(e){}
}
async function loadJSON(url,opt){
  const o=opt||{};
  if(o.ttl>0){
    const cached=cacheGet(url);
    if(cached!==null)return cached;
    const v=await getJSON(url,o);
    cacheSet(url,v,o.ttl);
    return v;
  }
  return await getJSON(url,o);
}

/* ============ 导航 ============ */
const NAV=[
 {id:'overview',label:'总览'},
 {id:'banks',label:'题库浏览'},
 {id:'search',label:'题目搜索'},
 {id:'official',label:'官方精选'},
 {id:'dianping',label:'真题讨论区'},
 {id:'video',label:'讲解视频'},
 {id:'rank',label:'排行榜'},
 {id:'jiaxiao',label:'驾校'},
 {id:'route',label:'路线视频'},
 {id:'icon',label:'交通图标'},
 {id:'kejian',label:'课件'},
 {id:'misc',label:'其他数据'},
];
const NUM=['01','02','03','04','05','06','07','08','09','10','11','12'];
function renderNav(){
  $('#sidebar').innerHTML=NAV.map((n,i)=>`<div class="nav-head">${NUM[i]}</div><a class="nav" data-view="${n.id}">${n.label}</a>`).join('');
  $('#sidebar').querySelectorAll('.nav').forEach(a=>a.onclick=()=>{currentView=a.dataset.view;crumb=[];renderNav();renderView();closeMenu();});
  const a=$('#sidebar').querySelector(`.nav[data-view="${currentView}"]`);

async function openQuestion(carType,qid){
  crumb=crumb.filter(c=>c.label!=='题 '+qid);

  renderNav();
  const main=$('#main');
  main.innerHTML=`<div class="loading">加载题目</div>`;
  try{
    const [q,vm]=await Promise.all([loadQuestions(carType),loadVids()]);

    if(!x){main.innerHTML=`<div class="empty">题 ${qid} 不在 ${carType} 库</div>`;return;}
    const letters='ABCDEFGH'.split('');
    const bits=[1,2,4,8,16,32,64,128];
    const sel=bits.filter(b=>(x.answer&b)).map(b=>letters[bits.indexOf(b)]);
    let html=crumbBar();
    html+=`<h1>题目 ${fmt(x.question_id)} <span class="hash">// ${esc(carType)}</span></h1>`;
    html+=qTags(x);
    html+=`<div class="detail">
      <div class="field"><span class="flabel">题干</span><span class="fval">${esc(x.question)}</span></div>`;
    if(x.media_type===1&&x.media_key)html+=`<div class="field"><span class="flabel">媒体</span><span class="fval dim">${esc(x.media_key)}</span><br><img class="media" src="/data/${carType}/media/${esc(x.media_key)}.jpg" onerror="this.style.display='none'"></div>`;
    if(x.media_type===2&&x.media_key)html+=`<div class="field"><span class="flabel">媒体</span><span class="fval dim">${esc(x.media_key)}</span><br><video class="media" src="/data/${carType}/media/${esc(x.media_key)}.mp4" controls></video></div>`;
    html+=`<div class="field"><span class="flabel">选项</span><span class="fval">`;
    (x.options||[]).forEach((o,i)=>{if(o)html+=`<span class="opt ${sel.includes(letters[i])?'correct':''}">${letters[i]}. ${esc(o)}</span>`;});
    html+=`</span></div>`;
    html+=`<div class="field"><span class="flabel">答案</span><span class="fval dim">${sel.join(',')} (位掩码 ${x.answer})</span></div>`;
    html+=`<div class="field"><span class="flabel">解析</span><span class="fval dim">${esc(x.explain||'--')}</span></div>`;
    if(x.concise_explain)html+=`<div class="field"><span class="flabel">速记</span><span class="fval dim">${esc(x.concise_explain)}</span></div>`;
    if(x.keywords)html+=`<div class="field"><span class="flabel">关键词</span><span class="fval dim">${esc(x.keywords)}</span></div>`;
    if(x.assured_keywords)html+=`<div class="field"><span class="flabel">锁定词</span><span class="fval dim">${esc(x.assured_keywords)}</span></div>`;
    if(x.illiteracy_explain)html+=`<div class="field"><span class="flabel">扫盲</span><span class="fval dim">${esc(x.illiteracy_explain)}</span></div>`;
    if(x.explain_keywords)html+=`<div class="field"><span class="flabel">解析词</span><span class="fval dim">${esc(x.explain_keywords)}</span></div>`;
    html+=`<div class="field"><span class="flabel">章节</span><span class="fval dim">${esc((x.chapter_names||[]).join(' / '))}</span></div>`;
    html+=`<div class="field"><span class="flabel">属性</span><span class="fval dim">难度 ${x.difficulty} · 错率 ${x.wrong_rate!=null?(x.wrong_rate*100).toFixed(1):'--'}% · 题型 ${x.option_type} · 排序 ${x.sort}</span></div>`;
    html+=`<div class="field"><span class="flabel">地区</span><span class="fval dim">${(x.areacodes||[]).join(', ')||'全国通用'}</span></div>`;
    if(x.vip_explain){
      html+=`<div class="field"><span class="flabel">巧记</span><span class="fval">${esc(x.vip_explain.artfulDetail||'--')}</span></div>`;
      html+=`<div class="field"><span class="flabel">精简</span><span class="fval">${esc(x.vip_explain.concise||'--')}</span></div>`;
    }
    html+=`<div class="field"><span class="flabel">全部字段</span><details><summary>JSON dump</summary><pre class="dump">${esc(JSON.stringify(x,null,1))}</pre></details></div>`;
    html+=`</div>`;

    loadDianping(qid,$('#dp'));

}

function searchView(main){

async function doSearch(q){
  const res=$('#search-res');
  if(!q){res.innerHTML='';return;}
  res.innerHTML='<div class="loading">搜索中</div>';
  try{
    if(!INDEX)INDEX=await loadJSON(DATA+'/index.json',{ttl:PAGE_CACHE_TTL});
    const banks=Object.keys(INDEX.dbs||{});
    const isId=/^\d+$/.test(q);
    const out=[];
    for(const b of banks){
      try{
        const all=await loadQuestions(b);
        for(const x of all){
          if(isId?String(x.question_id)===q:(x.question||'').includes(q)){
            out.push(x);if(out.length>=200)break;
          }
        }
      }catch(e){}
      if(out.length>=200)break;
    }
    if(!out.length){res.innerHTML='<div class="empty">无匹配</div>';return;}
    let html=`<div class="sub">${fmt(out.length)} 条${isId?' (精确题号)':''}</div><ul class="qlist">`;
    for(const x of out){
      html+=`<li onclick="openQuestion('${x.car_type}',${x.question_id})">
        <span class="qid">${esc(x.car_type)}:${fmt(x.question_id)}</span>
        <span class="qtext">${esc((x.question||'').slice(0,70))}</span></li>`;
    }
    html+='</ul>';
    res.innerHTML=html;
  }catch(e){res.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

const RANK_FILE='/harvested/rank/all-rank.json';  // 完整榜单数据(含 rankList top100)
let rankData=null;   // 榜单全量缓存

async function rankView(main){
  main.innerHTML='<div class="loading">加载排行榜</div>';

    let html=`<h1>排行榜 <span class="hash">// ${fmt(entries.length)} 个榜单</span></h1>
    <div class="sub">驾考宝典各科目(科目1/科目4/资格证)考试成绩实时榜, 每榜 top100 名, 按城市/驾校/全国 × 日/周/月/全部 采集. 点击榜单看排名详情.</div>
    <div class="grid">
      <div class="tile"><div class="n">${fmt(entries.length)}</div><div class="l">榜单总数</div></div>
      <div class="tile"><div class="n">${fmt(entries.reduce((a,v)=>a+(v.rankCount||0),0))}</div><div class="l">上榜人次</div></div>
      <div class="tile"><div class="n">${Object.values(scopes).reduce((a,s)=>a+s.n,0)}<small>×</small></div><div class="l">范围榜</div></div>
    </div>
    <h2>按范围浏览</h2><div class="car-grid">`;
    for(const [scope,st] of Object.entries(scopes)){
      html+=`<div class="car" onclick="rankScope('${scope}')"><div class="name">${esc(lbl[scope]||scope)}</div>
        <div class="qs">${fmt(st.n)} 榜单 · ${fmt(st.people)} 人次</div></div>`;
    }
    html+='</div>';
    main.innerHTML=html;
  }catch(e){main.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

function rankScope(scope){
  if(!rankData)return;
  const lbl={city:'城市榜',school:'驾校榜',country:'全国榜'};
  const sub=lbl[scope]||scope;
  currentView='rank';crumb=[{label:'排行榜',fn:()=>rankView($('#main'))},{label:sub}];
  renderNav();
  const main=$('#main');
  // 按城市分组（驾校榜/城市榜都按城市列；全国榜只有几个直接列）
  const cities={};
  for(const v of Object.values(rankData)){
    if(v.areaScope!==scope)continue;
    const c=v.cityName||'--';
    cities[c]=cities[c]||[];
    cities[c].push(v);
  }
  const cityNames=Object.keys(cities).sort((a,b)=>cities[b].length-cities[a].length);
  const tlbl={day:'今日',week:'本周',month:'本月',all:'全部'};
  let html=crumbBar();
  html+=`<h1>${esc(sub)} <span class="hash">// ${fmt(cityNames.length)} 城市 / ${fmt(Object.values(cities).reduce((a,c)=>a+c.length,0))} 榜</span></h1>
  <div class="sub">${scope==='country'?'全国各省/全国范围':(scope==='school'?'每个城市前2驾校的驾校成绩榜':'每个城市的城市成绩榜')} · 按 科目1/科目4/资格证 × 日/周/月/全部</div>
  <input id="search-box" placeholder="过滤城市名..."><div id="rank-scope"></div>`;
  main.innerHTML=html;
  const render=()=>{
    const f=$('#search-box').value.trim().toLowerCase();
    let h=`<table><tr><th>城市</th><th class="num">榜单</th><th>科目</th><th>时段</th></tr>`;
    for(const c of cityNames){
      if(f&&!c.toLowerCase().includes(f))continue;
      for(const v of cities[c]){
        const dom=v.domain||'';
        const kemu=dom.includes('zige')?'资格证':(dom.includes('ke4')?'科目4':'科目1');
        h+=`<tr style="cursor:pointer" onclick="rankDetail('${esc(v.cityCode||v.rankArea||c)}','${esc(v.timeScope)}','${esc(dom)}')">
          <td>${esc(c)}</td><td class="num">${fmt(v.rankCount||0)}</td>
          <td class="dim">${kemu}</td><td class="dim">${tlbl[v.timeScope]||v.timeScope}</td></tr>`;
      }
    }
    h+='</table>';
    $('#rank-scope').innerHTML=h;
  };
  $('#search-box').oninput=render;render();
}

function rankDetail(cityCode,timeScope,domain){
  if(!rankData)return;
  // 在数据里找对应榜单（用 cityCode+timeScope+domain 定位，驾校榜需额外 schoolCode 但这里取第一个匹配）
  const hits=Object.entries(rankData).filter(([k,v])=>v.areaScope!=='country'&&v.cityCode==cityCode&&v.timeScope==timeScope&&v.domain==domain);
  if(!hits.length){alert('未找到该榜单');return;}
  const [k,v]=hits[0];
  currentView='rank';crumb=[{label:'排行榜',fn:()=>rankView($('#main'))},{label:(v.cityName||cityCode)+' '+(v.timeScope||'')}];
  renderNav();
  const main=$('#main');
  const tlbl={day:'今日',week:'本周',month:'本月',all:'全部'};
  const dom=v.domain||'';
  const kemu=dom.includes('zige')?'资格证':(dom.includes('ke4')?'科目4':'科目1');
  const list=v.rankList||[];
  const fmtDur=s=>{if(s==null)return '--';if(s<60)return s+'s';const m=Math.floor(s/60),r=s%60;return m+'m'+r+'s';};
  const dt=t=>t?new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'--';
  const medal=r=>r===1?'🥇':(r===2?'🥈':(r===3?'🥉':''));
  let html=crumbBar();
  html+=`<h1>${esc((v.cityName||v.rankArea||cityCode)+' · '+kemu)} <span class="hash">// ${esc(tlbl[v.timeScope]||v.timeScope)}榜 top${fmt(list.length)}</span></h1>
  <div class="sub">${v.schoolName&&v.areaScope==='school'?esc(v.schoolName)+' · ':''}成绩排名. 分数相同时按完成用时排序(用时少者靠前). 抓取于 ${dt(v.dateTime)}.</div>
  <table><tr><th>#</th><th>昵称</th><th class="num">分数</th><th class="num">用时</th><th>考试时间</th></tr>`;
  for(const r of list){
    html+=`<tr><td>${medal(r.rank)}${r.rank||'-'}</td>
      <td>${esc(r.nickname||'匿名')}</td>
      <td class="num">${r.score??'--'}</td>
      <td class="num">${fmtDur(r.elapsed)}</td>
      <td class="dim">${dt(r.examTime)}</td></tr>`;
  }
  html+='</table>';
  main.innerHTML=html;
}
window.rankScope=rankScope;window.rankDetail=rankDetail;

      <div class="tile"><div class="n">${fmt(permLocked)}</div><div class="l">VIP预览(29s)</div></div>

    for(const k of keys){
      const chs=d[k]||[];

      for(const c of chs){
        const lds=c.lectureDataList||[];

        for(const l of lds){
          const prev=l.previewDuration??l.duration??29;
          const full=l.originalDuration??'';
          const st=l.permission
            ?'<span class="badge ok">开放</span>'
            :`<span class="badge vip" title="官方仅开放${prev}秒预览, 完整版需VIP">VIP预览</span>`;

            ?`${l.duration??'--'}${full&&full!==l.duration?`<span class="dim">/${full}</span>`:''}`
            :`<span class="dim" title="官方仅下发${prev}秒预览片段">${prev}s</span><span class="dim">/${full}</span>`;
          html+=`<tr><td>${esc(l.title||'--')}</td><td>${esc(l.subTitle||'')}</td>
            <td>${st}</td>

      }

    }
    html+=`<div class="sub" style="margin-top:12px">课件视频实测 HTTP 403 不可播放(与讲解视频不同, 讲解视频全部可播). 数据中 permission 全为 false, 官方仅下发29秒预览, 完整版需 VIP 账号.</div>`;

  }catch(e){main.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

  ];
  let html=`<h1>其他数据</h1><div class="sub">探测/辅助数据域. 每项 JSON dump.</div>`;
  for(const [k,label,url] of items)html+=`<details><summary>${label} (${k})</summary><div id="misc-${k}"><div class="loading">加载</div></div></details>`;
  main.innerHTML=html;
  for(const [k,label,url,c] of items){
    (async()=>{
      const el=main.querySelector(`#misc-${k}`);
      try{
        const d=await loadJSON(url,{ttl:PAGE_CACHE_TTL});
        el.innerHTML=`<div class="sub">${fmt(c(d))} 条</div><pre class="dump">${esc(JSON.stringify(d,null,1).slice(0,3000))}</pre>`;
      }catch(e){el.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
    })();
  }
}

/* 暴露给 onclick */
window.openCar=openCar;window.openChapter=openChapter;window.openQuestion=openQuestion;
window.openSchools=openSchools;window.routeDetail=routeDetail;
window.routePlace=routePlace;

/* ============ 启动 ============ */
renderNav();
overviewView($('#main'));
</script>
